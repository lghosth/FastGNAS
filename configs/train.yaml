training:
dataset: PubMed # Cora, PubMed
lr: 0.005  # Learning rate
weight_decay: 0.0005 # Weight decay (L2 regularization)
dropout: 0.6  # Dropout rate
val_interval: 10
batch_size: 64   # Number of seed nodes per mini-batch
epochs_per_rotation: 5
steps_per_epoch: 1 # Deprecated: steps per training epoch
base_steps_per_epoch: 50       # Base steps per epoch for calculation

nas:

Search process parameters

num_search_rounds: 100       # Total number of architectures to search (S)
samples_per_round: 2             # Samples per round
first_round_samples: 5         # Samples in the first round
first_round_retrain_epochs: 5    # Retrain epochs for first round models
final_candidates: 5              # Number of final candidates (K)
final_retrain_epochs: 20         # Retrain epochs for final candidates (N)

Architecture definition parameters

gnn_layers: 2                    # Number of GNN layers (L)
num_intermediate_nodes: 4        # Intermediate nodes (Q) for cell-based search
search_strategy: "layer_wise"    # Search strategy: "layer_wise" or "cell_based"

Controller network architecture

controller_hidden_size: 100      # Controller LSTM hidden size
controller_num_layers: 1         # Controller LSTM layers (current impl. is single-layer)

Controller optimizer parameters

controller_lr: 0.00035           # Controller learning rate
controller_baseline_decay: 0.9   # Baseline decay
weight_init_range: 0.1           # Weight initialization range

Sampling and reward parameters

tanh_constant: 2.5               # Tanh constant for sampling
temperature: 5.0                 # Temperature for sampling
entropy_weight: 0.0001           # Entropy weight for reward

balancing_strategy:
enable: false                # Enable balancing strategy (true: new, false: original)
min_samples: 3               # NGmin: Minimum number of GNN architectures
max_samples: 10              # NGmax: Maximum number of GNN architectures
tolerance: 0.1               # NGT: Load imbalance tolerance (e.g., 0.1 for 10% difference)
