training:
  dataset: ogbn-products
  lr: 0.01
  weight_decay: 0.0005
  dropout: 0.6
  val_interval: 10
  batch_size: 256
  num_eval_rounds: 2
  epochs_per_rotation: 5
  steps_per_epoch: 5
  fan_out:
  - 15
  - 10
  train_partition_strategy: balanced_stratified_khop
  data_collection:
    enable_mload_collector: false
    collector_type: dataset
    priority_order:
    - partition
    - dataset
    dataset_dir: dataset/Mload_dataset
    file_prefix: test
    time_window_mode: batch
    flush_every: 1
    device_type: a6000
  devie_config:
    device_type: a6000
    device_GPU: 8
    num_workers: 8
    workers:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
  evaluation:
    batch_size: 256
  state_manager:
    max_memory_states: 10000
  subtask_scheduler:
    load_variance_threshold: 0.3
    load_tolerance: 0.1
    min_batch_per_round: 3
    max_batch_per_round: 25
nas:
  num_search_rounds: 5
  samples_per_round: 2
  first_round_samples: 5
  first_round_retrain_epochs: 5
  final_candidates: 5
  final_retrain_epochs: 20
  gnn_layers: 2
  num_intermediate_nodes: 4
  search_strategy: layer_wise
  controller_hidden_size: 100
  controller_num_layers: 1
  controller_lr: 0.00035
  controller_baseline_decay: 0.9
  weight_init_range: 0.1
  tanh_constant: 2.5
  temperature: 5.0
  entropy_weight: 0.0001
  enable_global_evaluation: true
  hyperparameter_optimization:
    strategy: bayesian
    n_initial_points: 42
    n_calls: 100
    acquisition_func: EI
    early_stop_patience: 3
  balancing_strategy:
    enable: true
    batch_size: 24
    min_architectures: 8
    min_samples: 3
    max_samples: 10
    tolerance: 0.1
    rotation_mode: subtask
