parallel_backends:
  dataset: ''
  dataset_root: dataset
  num_workers: 8
  device_GPU: 8
  workers:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  learning_rate: 0.01
  weight_decay: 0.0005
  dropout: 0.6
  num_classes: 7
  backend: parallel_v2
  ray:
    init_kwargs:
      include_dashboard: false
training:
  epochs_per_round: 5
  num_rounds: 2
  batch_size: 1024
  steps_per_epoch: 5
  fan_out:
  - -1
  - -1
architecture:
  sampler:
    initial_samples: 10
    shapley:
      random_seed: 42
      min_training_samples: 5
      pruning_threshold: 0.5
      pruning_iterations: 1
      pruning_retrain_each_round: true
      pruning_stop_when_no_change: true
      use_dgnap_pruning: true
      top_k_candidates: 10
      max_candidates: 20
      predictor:
        model_type: mlp
        hidden_dims:
        - 64
        - 32
        dropout: 0.1
        learning_rate: 0.001
        epochs: 100
        early_stopping_patience: 10
      shapley:
        method: sampling
        num_samples: 1000
        max_combinations: 10000
logging:
  level: INFO
  save_logs: true
  log_dir: experiment/Ad_OD-shapley/log
experiment:
  name: ad_od_shapley_experiment
  use_random_seed: false
  random_seed: 42
  description: Architecture-Parallel (parallel_v2) + Shapley Search experiment
